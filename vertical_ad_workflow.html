// ── Worker API ────────────────────────────────────────────────────────────────
// Gemini API は Cloudflare Worker 側で呼び出す。
// フロントは { prompt } を POST → Worker が { text } を返す。

// Worker の /generate パスに POST する（デプロイ済み Worker と一致）
async function callWorker(prompt, workerUrl, maxOutputTokens = 800) {
  if (!workerUrl) throw new Error("Worker URLが未設定です。左下の「⚙ 設定」からURLを入力してください。");

  const endpoint = workerUrl.replace(/\/$/, "") + "/generate";
  console.log("[callWorker] endpoint:", endpoint, "/ maxOutputTokens:", maxOutputTokens);

  let res;
  try {
    res = await fetch(endpoint, {
      method : "POST",
      headers: { "Content-Type": "application/json" },
      body   : JSON.stringify({ prompt, maxOutputTokens }),
    });
  } catch(e) {
    throw new Error("ネットワークエラー: Workerに接続できません。URLを確認してください。\n→ " + endpoint + "\n" + e.message);
  }

  const rawText = await res.text();
  console.log("[callWorker] raw response:", rawText.slice(0, 300));

  if (!res.ok) {
    let detail = rawText;
    try { detail = JSON.parse(rawText).error || rawText; } catch {}
    throw new Error(`Worker エラー HTTP ${res.status}:\n${detail}`);
  }

  let data;
  try { data = JSON.parse(rawText); } catch {
    throw new Error(`Worker レスポンスのJSON解析失敗:\n${rawText.slice(0, 300)}`);
  }

  const text = data.text;
  if (!text) throw new Error(`Worker から text が返りませんでした。\n生レスポンス: ${rawText.slice(0, 300)}`);

  return parseGeminiText(text);
}

// Geminiが返すテキストからJSONを確実に取り出す
function parseGeminiText(text) {
  if (!text || typeof text !== "string") return text;

  // 1. コードフェンス内のJSONを抽出（最も一般的なパターン）
  const fenceMatch = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if (fenceMatch) {
    try { return JSON.parse(fenceMatch[1].trim()); } catch {}
  }

  // 2. フェンスを全て除去して試行
  const stripped = text.replace(/```(?:json)?/gi, "").replace(/```/g, "").trim();
  try { return JSON.parse(stripped); } catch {}

  // 3. テキスト中の最初の [ または { から最後の ] または } を抽出
  const arrMatch = text.match(/(\[[\s\S]*\])/);
  if (arrMatch) { try { return JSON.parse(arrMatch[1]); } catch {} }

  const objMatch = text.match(/(\{[\s\S]*\})/);
  if (objMatch) { try { return JSON.parse(objMatch[1]); } catch {} }

  // 4. 全て失敗 → 生テキストのまま返す
  console.warn("[parseGeminiText] JSON抽出失敗。生テキストを返します:", text.slice(0, 200));
  return text;
}

// fetchLP: allorigins.win 経由でページテキストを取得
async function fetchLP(url){
  const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
  if(!res.ok) throw new Error("ページ取得失敗 (allorigins HTTP "+res.status+")");
  const d=await res.json();
  return(d.contents||"")
    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"")
    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi,"")
    .replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,4000);
}

async function callPollinations(prompt,model="flux"){
  const seed=Math.floor(Math.random()*999999);
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=576&height=1024&model=${model}&nologo=true&seed=${seed}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error("Pollinations error: "+res.status);
  const blob=await res.blob();
  return URL.createObjectURL(blob);
}

// ── Video Analysis ────────────────────────────────────────────────────────────
function detectPlatform(url){
  if(/youtu\.be\/|youtube\.com/.test(url)) return "YouTube";
  if(/tiktok\.com/.test(url)) return "TikTok";
  if(/instagram\.com/.test(url)) return "Instagram";
  return "Unknown";
}

async function fetchVideoMeta(url){
  const platform=detectPlatform(url);
  let title="",thumbnail="",description="",author="";
  try{
    // noembed works for YouTube & TikTok
    const r=await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
    const d=await r.json();
    title=d.title||"";thumbnail=d.thumbnail_url||"";author=d.author_name||"";
  }catch(e){}
  // Try to get YouTube description via allorigins
  if(platform==="YouTube"){
    try{
      const pageText=await fetchLP(url);
      // description is often in og:description or the first large text block
      const m=pageText.match(/description["\s:]+([^"]{30,300})/i);
      if(m)description=m[1].replace(/\\n/g," ").trim();
    }catch(e){}
  }
  return {platform,title,thumbnail,description,author,url};
}

async function analyzeRefVideo(url,geminiKey){
  const meta=await fetchVideoMeta(url);
  const prompt=`あなたは縦型広告のクリエイティブディレクターです。
参考動画のメタ情報から広告制作に役立つ参考摘要を日本語で生成してください。
出力はJSONのみ。前置き・コードブロック不要。

プラットフォーム: ${meta.platform}
タイトル: ${meta.title||"不明"}
作者: ${meta.author||"不明"}
URL: ${url}

{"openingType":"開頭タイプ（問題提起型/反差型/直球型/共感型/数字型）","pace":"テンポ（速い/中/ゆっくり）","format":"表現形式","subtitleStyle":"字幕スタイル","sellingOrder":["卖点①","卖点②"],"goodPoints":["参考ポイント①","②"],"avoidPoints":["避けるべき点①"],"oneLineSummary":"一言まとめ"}`;
  const analysis=await callGemini(prompt,geminiKey,500);
  return {...meta,analysis:(typeof analysis==="object"&&analysis!==null)?analysis:{}};
}

  const doLP=async()=>{
    if(!lpUrl||!geminiKey)return;
    setLpLoading(true);setLpStatus(null);
    // Worker root URL（/generate パスではなく root へ action で送る）
    const workerRoot=geminiKey.replace(/\/$/,"");
    const reqBody={action:"analyze_lp",url:lpUrl};
    console.log("=== [LP] analyze_lp 開始 ===");
    console.log("[LP] Worker URL:", workerRoot);
    console.log("[LP] request body:", JSON.stringify(reqBody));
    try{
      let res;
      try{
        res=await fetch(workerRoot,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(reqBody),
        });
      }catch(networkErr){
        console.error("[LP] ネットワークエラー詳細:");
        console.error("  Worker URL:", workerRoot);
        console.error("  request body:", JSON.stringify(reqBody));
        console.error("  fetch error:", networkErr.message);
        console.error("  error type:", networkErr.name);
        throw new Error("Worker 接続失敗 ("+workerRoot+")\n→ "+networkErr.message+"\n\nWorkerがデプロイ済みか、URLが正しいか確認してください。");
      }

      const rawText=await res.text();
      console.log("[LP] Worker HTTP status:", res.status);
      console.log("[LP] Worker raw response:", rawText.slice(0,400));

      if(!res.ok){
        let detail=rawText;
        try{detail=JSON.parse(rawText).error||rawText;}catch{}
        throw new Error("Worker HTTP "+res.status+": "+detail.slice(0,150));
      }

      let data;
      try{data=JSON.parse(rawText);}catch{
        throw new Error("Worker レスポンスのJSON解析失敗: "+rawText.slice(0,150));
      }

      // Worker がページ取得失敗を ok:false で返した場合
      if(data.ok===false){
        const detail=data.details?"（"+data.details+"）":"";
        const status=data.target_status?` [HTTP ${data.target_status}]`:"";
        setLpStatus({
          ok:false,fetchFailed:true,
          msg:"自動取得できませんでした"+status+"\n"+detail+"\n手動でフォームに入力して先に進めます。",

        setLpLoading(false);
        return;

      // 成功 → フォームへ反映

        const u={lpUrl};
        if(data.client_name)  u.clientName=data.client_name;
        if(data.product_name) u.product=data.product_name;
        if(data.target)       u.target=data.target;
        if(data.cta)          u.cta=data.cta;

          fp.push("【キーワード】"+data.keywords.join("、"));
        if(fp.length>0) u.features=fp.join("\n");
        u.lpSummary=[data.product_name,data.category,data.description].filter(Boolean).join(" / ").slice(0,150);
        return{...p,...u};
      });
      setLpStatus({ok:true,msg:"✓ LP解析完了："+(data.product_name||data.client_name||"情報")+"を自動入力しました"});

    }catch(e){
      console.error("[LP] エラー:", e.message);
      setLpStatus({ok:false,fetchFailed:true,msg:"エラー: "+e.message+"\n手動でフォームに入力して先に進めます。"});

// ── STEP 02 ペルソナ ──────────────────────────────────────────────────────────
// ── Step 02 専用：Workerレスポンスからペルソナ配列を取り出す ─────────────────
function parsePersonaResult(raw) {
  // raw はフロントの callWorker が返した値（JSON.parse済みかもしれないし文字列かもしれない）

  // ① すでにオブジェクト/配列として渡ってきた場合
  if (raw && typeof raw === "object") {
    // { personas: [...] } 形式
    if (Array.isArray(raw.personas) && raw.personas.length > 0) {
      console.log("[parsePersonaResult] ① personas ラッパーで取得:", raw.personas.length, "件");
      return raw.personas;
    }
    // 裸の配列
    if (Array.isArray(raw) && raw.length > 0) {
      console.log("[parsePersonaResult] ② 裸の配列で取得:", raw.length, "件");
      return raw;
    }
    // { _raw: "..." } デバッグ用フォールバック
    if (raw._raw) {
      console.warn("[parsePersonaResult] Workerが _raw を返しました。パース失敗の可能性:", raw._raw);
      return parsePersonaResult(raw._raw); // 文字列として再帰
    }
  }

  // ② 文字列として渡ってきた場合（callWorkerのJSONパース失敗時）
  if (typeof raw === "string") {
    const text = raw;
    console.log("[parsePersonaResult] 文字列として受け取り（先頭200文字）:", text.slice(0, 200));

    // a. コードフェンス除去
    const cleaned = text.replace(/```(?:json)?/gi, "").replace(/```/g, "").trim();

    // b. { "personas": [...] } を抽出
    const wrapMatch = cleaned.match(/\{\s*"personas"\s*:\s*(\[[\s\S]*?\])\s*\}/);
    if (wrapMatch) {
      try {
        const arr = JSON.parse(wrapMatch[1]);
        if (Array.isArray(arr) && arr.length > 0) {
          console.log("[parsePersonaResult] ③ personas ラッパーを文字列から抽出:", arr.length, "件");
          return arr;
        }
      } catch(e) { console.warn("[parsePersonaResult] wrapMatch parse失敗:", e.message); }
    }

    // c. 最初の [ ... ] を抽出
    const arrMatch = cleaned.match(/(\[[\s\S]*\])/);
    if (arrMatch) {
      try {
        const arr = JSON.parse(arrMatch[1]);
        if (Array.isArray(arr) && arr.length > 0) {
          console.log("[parsePersonaResult] ④ 裸配列を文字列から抽出:", arr.length, "件");
          return arr;
        }
      } catch(e) { console.warn("[parsePersonaResult] arrMatch parse失敗:", e.message); }
    }

    // d. 全部失敗 → デバッグ用に全出力
    console.error("[parsePersonaResult] 全パターン失敗。raw:", text);
    console.error("[parsePersonaResult] cleaned:", cleaned);
    return [];
  }

  console.error("[parsePersonaResult] 予期しない型:", typeof raw, raw);
  return [];
}

// ── Step 03 スクリプト結果パーサー ────────────────────────────────────────────
function parseScriptResult(raw) {
  console.log("[parseScriptResult] 入力 type:", typeof raw);
  console.log("[parseScriptResult] 入力 raw:", JSON.stringify(raw).slice(0, 400));

  // 既にオブジェクトなら直接使用
  if (raw && typeof raw === "object" && !Array.isArray(raw)) {
    if (raw.hook !== undefined || raw.script !== undefined || raw.scenes !== undefined || raw.cuts !== undefined) {
      console.log("[parseScriptResult] Stage0: オブジェクト直接使用");
      return raw;
    }
    if (raw._raw) return parseScriptResult(raw._raw);
  }

  // 文字列化して解析
  let text = typeof raw === "string" ? raw : (raw?._raw || JSON.stringify(raw));

  // Stage 1: コードフェンスを抽出してパース
  const fenceMatch = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if (fenceMatch) {
    try {
      const r = JSON.parse(fenceMatch[1].trim());
      console.log("[parseScriptResult] Stage1(fence) 成功");
      return r;
    } catch(e) { console.warn("[parseScriptResult] Stage1(fence) 失敗:", e.message); }
  }

  // Stage 2: フェンス除去してパース
  const stripped = text.replace(/```(?:json)?/gi, "").replace(/```/g, "").trim();
  try {
    const r = JSON.parse(stripped);
    console.log("[parseScriptResult] Stage2(strip) 成功");
    return r;
  } catch(e) { console.warn("[parseScriptResult] Stage2(strip) 失敗:", e.message); }

  // Stage 3: 最初の { から最後の } までを確実に抽出（greedy で outermost）
  const firstBrace = stripped.indexOf("{");
  const lastBrace  = stripped.lastIndexOf("}");
  if (firstBrace !== -1 && lastBrace > firstBrace) {
    const extracted = stripped.slice(firstBrace, lastBrace + 1);
    console.log("[parseScriptResult] Stage3 extracted:", extracted.slice(0, 200));
    try {
      const r = JSON.parse(extracted);
      console.log("[parseScriptResult] Stage3(slice) 成功");
      return r;
    } catch(e) { console.warn("[parseScriptResult] Stage3(slice) 失敗:", e.message); }
  }

  // Stage 4: 全失敗 — デバッグ用に全情報を出力
  console.error("[parseScriptResult] 全Stage失敗");
  console.error("[parseScriptResult] raw (先頭500):", text.slice(0, 500));
  console.error("[parseScriptResult] cleaned (先頭500):", stripped.slice(0, 500));
  console.error("[parseScriptResult] firstBrace:", firstBrace, "lastBrace:", lastBrace);
  return null;
}

// ── ペルソナの欠損・壊れたフィールドを補完する ───────────────────────────────
// 「/」「・」「—」のみの値は空扱いにしてフォールバックを返す
function cleanField(v, fallback = "—") {
  if (!v || typeof v !== "string") return fallback;
  const stripped = v.replace(/[/・\-\—\s]/g, "").trim();
  return stripped.length > 0 ? v.trim() : fallback;
}

function normalizePersona(p, productName = "") {
  if (!p || typeof p !== "object") return null;
  return {
    name:           cleanField(p.name,           "名前未取得"),
    age:            cleanField(p.age,            "年代不明"),
    gender:         cleanField(p.gender,         "—"),
    job:            cleanField(p.job,            "職業不明"),
    location:       cleanField(p.location,       "—"),
    income:         cleanField(p.income,         "—"),
    family:         cleanField(p.family,         "—"),
    values:         cleanField(p.values,         "—"),
    pain:           cleanField(p.pain,           "（悩み情報なし）"),
    pastAction:     cleanField(p.pastAction,     "—"),
    leavingReason:  cleanField(p.leavingReason,  "—"),
    searchBehavior: cleanField(p.searchBehavior, "—"),
    decisionFactor: cleanField(p.decisionFactor, "—"),
    insight:        cleanField(p.insight,        productName ? `${productName}に興味を持つユーザー` : "インサイト未取得"),
    desire:         cleanField(p.desire,         "—"),
    appeals: (Array.isArray(p.appeals) && p.appeals.filter(a => cleanField(a,"") !== "—").length > 0)
               ? p.appeals.map(a => cleanField(a,"")).filter(a => a !== "—")
               : ["商品の特徴・ベネフィット","使いやすさ・手軽さ","信頼感・実績"],
  };
}

        slide.addText(sec.text,{x:LX+0.10,y:cy+0.06,w:LW-0.20,h:bh-0.12,fontSize:10,color:BLACK,align:"left",valign:"top",wrap:true,margin:0});
        cy+=bh+0.18;
      }
      const RX=2.72,RW=6.98,RY=0.68,RA=4.70;
      slide.addShape(pres.shapes.RECTANGLE,{x:RX,y:RY,w:RW,h:0.34,fill:{color:RED},line:{color:RED}});
      slide.addText("字コンテ",{x:RX,y:RY,w:RW,h:0.34,fontSize:13,bold:true,color:WHITE,align:"center",valign:"middle",margin:0});
      const BY=RY+0.34,BH=RA-0.34;
      slide.addShape(pres.shapes.RECTANGLE,{x:RX,y:BY,w:RW,h:BH,fill:{color:WHITE},line:{color:RED,pt:1}});
      const scenes=jicon.scenes||[];
      const rich=[];
      scenes.forEach((s,idx)=>{
        rich.push({text:`${idx+1}　${s.scene||""}`,options:{fontSize:9.5,color:BLACK,bold:true,breakLine:true}});
        if(s.text)rich.push({text:"　　テロップ/ナレーション："+s.text,options:{fontSize:9,color:"333333",breakLine:true}});
        if(s.visual)rich.push({text:"　　映像演出："+s.visual,options:{fontSize:8,color:"888888",italic:true,breakLine:true}});
        if(idx<scenes.length-1)rich.push({text:" ",options:{fontSize:5,breakLine:true}});
      });
      if(rich.length>0)delete rich[rich.length-1].options.breakLine;
      slide.addText(rich,{x:RX+0.14,y:BY+0.10,w:RW-0.28,h:BH-0.20,valign:"top",margin:0});
      slide.addText("1",{x:0,y:5.42,w:10,h:0.20,fontSize:9,color:"999999",align:"right",margin:0});
      const fname=(info.product||"script").replace(/[\\/:*?"<>|]/g,"_")+"_字コンテ.pptx";
      await pres.writeFile({fileName:fname});
      setPptxOk(true);
    }catch(e){setPptxErr("エクスポートエラー: "+e.message);}
    setExpPptx(false);
  };

  const passCount=checkResults?.filter(r=>r.pass).length||0;
  const total=CHECKLIST.length;

  return (
    <div className="fadeIn">
      <StageHeader step="03" title="字コンテ" sub="ペルソナのインサイトとチェックリストを基準に生成します"/>

          <Btn onClick={generate} disabled={loading||!persona}>{loading?<><Spin size={14}/> 生成中...</>:"字コンテを生成する"}</Btn>

// ── STEP 04 素材生成 ──────────────────────────────────────────────────────────
const StageSozai = ({info,jicon,prompts,setPrompts,assets,setAssets,geminiKey,onNext}) => {
  const [promptLoading,setPromptLoading]=useState(false);
  const [promptErr,setPromptErr]=useState("");
  const [loadingCut,setLoadingCut]=useState(null);
  const [imgErrors,setImgErrors]=useState({});
  const [tool,setTool]=useState("pollinations_flux");

  const IMAGE_TOOLS=[
    {id:"pollinations_flux",label:"Pollinations FLUX",badge:"無料・APIキー不要",c:C.green},
    {id:"pollinations_turbo",label:"Pollinations Turbo",badge:"無料・高速",c:C.teal},
  ];

  const generatePrompts=async()=>{
    setPromptLoading(true);setPromptErr("");
    try{
      const prompt=`あなたはAIプロンプトエンジニアです。字コンテの各カットに対して素材生成用Promptを作成してください。
出力はJSON配列のみ。前置き不要。
[{"cutNo":1,"assetType":"image","visualDesc":"画面説明（日本語）","cameraAngle":"アングル","imagePrompt":"英語Prompt"}]

商品: ${info.product||"未設定"} / トーン: ${(info.tones||[]).join("・")} / スタイル: ${info.style||"未設定"}

字コンテ:
${JSON.stringify((jicon.cuts||[]).map(c=>({cutNo:c.cutNo,phase:c.phase,narration:c.narration,direction:c.direction})))}

imagePromptは"Japanese aesthetic, 9:16 vertical composition, Asian model,"で始めること。`;
      const arr=await callGemini(prompt,geminiKey,800);
      setPrompts(Array.isArray(arr)?arr:[]);
    }catch(e){setPromptErr("エラー: "+e.message);}
    setPromptLoading(false);
  };

  const genImage=async(cut)=>{
    setLoadingCut(cut.cutNo);
    setImgErrors(p=>{const n={...p};delete n[cut.cutNo];return n;});
    try{
      const prompt=cut.imagePrompt||cut.geminiPrompt||"";
      let url;
      if(tool==="pollinations_flux")url=await callPollinations(prompt,"flux");
      else if(tool==="pollinations_turbo")url=await callPollinations(prompt,"turbo");
      else url=await callPollinations(prompt,"flux");
      setAssets(p=>({...p,[cut.cutNo]:{...p[cut.cutNo],image:url}}));
    }catch(e){setImgErrors(p=>({...p,[cut.cutNo]:e.message}));}
    setLoadingCut(null);
  };

  const genAll=async()=>{for(const cut of(prompts||[]).filter(c=>c.assetType==="image"))await genImage(cut);};

  if(!jicon)return(
    <div className="fadeIn">
      <StageHeader step="04" title="素材生成" sub="字コンテをもとに素材を生成します"/>
      <Card style={{textAlign:"center",padding:32}}><div style={{color:C.t2}}>先に字コンテを生成してください</div></Card>
    </div>
  );

  const imgCuts=(prompts||[]).filter(c=>c.assetType==="image");
  const vidCuts=(prompts||[]).filter(c=>c.assetType==="video");

  return(
    <div className="fadeIn">
      <StageHeader step="04" title="素材生成" sub="Promptを生成 → 画像生成（英語Promptはコピー可）"/>
      {!prompts?(
        <Card glow={C.greenG} style={{textAlign:"center",padding:48,marginBottom:20}}>
          <div style={{fontSize:42,marginBottom:14}}>✦</div>
          <div style={{fontSize:16,color:C.t1,marginBottom:6,fontWeight:600}}>まずPromptを自動生成します</div>
          <div style={{fontSize:13,color:C.t2,marginBottom:24}}>字コンテの各カットにAI画像生成Prompt（英語）を生成します</div>
          {promptErr&&<div style={{color:C.red,fontSize:13,marginBottom:16,padding:12,background:C.redG,borderRadius:6,textAlign:"left"}}>{promptErr}</div>}
          <Btn onClick={generatePrompts} disabled={promptLoading}>{promptLoading?<><Spin size={14}/> Prompt生成中...</>:"Promptを生成する"}</Btn>
        </Card>
      ):(
        <>
          <Card style={{marginBottom:16}}>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:C.t2,fontFamily:C.mono,letterSpacing:1,marginBottom:8}}>画像生成ツール — すべて無料</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {IMAGE_TOOLS.map(t=>(
                  <div key={t.id} onClick={()=>setTool(t.id)} style={{padding:"8px 14px",borderRadius:8,cursor:"pointer",transition:"all 0.15s",background:tool===t.id?`${t.c}20`:C.bg3,border:`1px solid ${tool===t.id?t.c+"60":C.border}`}}>
                    <div style={{fontSize:13,fontWeight:tool===t.id?700:400,color:tool===t.id?t.c:C.t1}}>{t.label}</div>
                    <div style={{fontSize:10,color:tool===t.id?t.c:C.t3,marginTop:2}}>{t.badge}</div>
                  </div>
                ))}
              </div>

            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <Btn small variant="secondary" onClick={()=>{setPrompts(null);setTimeout(generatePrompts,50);}}>🔄 再生成</Btn>
              {imgCuts.length>0&&<Btn small variant="green" onClick={genAll}>⚡ 全画像一括生成</Btn>}
            </div>
          </Card>
          {imgCuts.length>0&&(
            <>
              <SecLabel>🖼 静止画カット（{imgCuts.length}件）</SecLabel>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:14,marginBottom:24}}>
                {imgCuts.map(cut=>{
                  const img=assets[cut.cutNo]?.image;
                  const isLoad=loadingCut===cut.cutNo;

                  const jcut=jicon.cuts.find(c=>c.cutNo===cut.cutNo)||{};
                  return(
                    <Card key={cut.cutNo}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <span style={{fontFamily:C.mono,fontWeight:700}}>カット #{cut.cutNo}</span>
                        <Tag>{jcut.phase||""}</Tag>
                      </div>
                      <div style={{width:"100%",aspectRatio:"9/16",maxHeight:220,background:C.bg3,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",marginBottom:8}}>
                        {img?<img src={img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                          :isLoad?<div style={{textAlign:"center"}}><Spin size={24}/><div style={{fontSize:11,color:C.t2,marginTop:8}}>生成中...</div></div>

                      </div>
                      <div style={{background:C.bg3,borderRadius:6,padding:"7px 10px",marginBottom:8}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                          <Tag color={C.green}>AI画像Prompt</Tag>
                          <CopyBtn text={cut.imagePrompt||""}/>
                        </div>
                        <div style={{fontSize:11,color:C.t2,fontFamily:C.mono,lineHeight:1.5,wordBreak:"break-word",maxHeight:52,overflow:"hidden"}}>{cut.imagePrompt}</div>
                      </div>
                      {er&&<div style={{fontSize:11,color:C.red,marginBottom:8,padding:"6px 8px",background:C.redG,borderRadius:4}}>{er}</div>}
                      <div style={{display:"flex",gap:6}}>
                        <Btn small variant="blue" onClick={()=>genImage(cut)} disabled={isLoad} style={{flex:1}}>{isLoad?<Spin size={12}/>:img?"🔄 再生成":"⚡ 生成"}</Btn>

                      </div>
                    </Card>
                  );
                })}
              </div>
            </>
          )}
          {vidCuts.length>0&&(
            <>
              <SecLabel>🎬 動画カット（{vidCuts.length}件）</SecLabel>
              <div style={{padding:12,background:C.bg3,borderRadius:8,marginBottom:12,fontSize:13,color:C.t2}}>
                以下の英語Promptをお好みの動画生成ツール（Runway / Pika / Kling など）にコピーして使用してください。
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
                {vidCuts.map(cut=>{
                  const jcut=jicon.cuts.find(c=>c.cutNo===cut.cutNo)||{};
                  return(
                    <Card key={cut.cutNo} style={{borderLeft:`3px solid ${C.purple}`}}>
                      <div style={{display:"flex",gap:16}}>
                        <div style={{textAlign:"center",minWidth:60}}>
                          <div style={{fontFamily:C.mono,fontSize:18,fontWeight:700}}>#{cut.cutNo}</div>
                          <Tag color={C.purple}>動画</Tag>
                          <div style={{fontSize:11,color:C.t2,marginTop:4,fontFamily:C.mono}}>{jcut.startSec}s〜{jcut.endSec}s</div>
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,color:C.t2,marginBottom:8}}>{cut.visualDesc}</div>
                          <div style={{background:C.bg3,borderRadius:6,padding:10,fontFamily:C.mono,fontSize:12,color:C.t1,lineHeight:1.6,marginBottom:8,wordBreak:"break-word"}}>{cut.imagePrompt}</div>
                          <CopyBtn text={cut.imagePrompt||""}/>
                        </div>
                      </div>
                    </Card>
                  );
                })}
              </div>
            </>
          )}
          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <Btn onClick={onNext}>絵コンテへ →</Btn>
          </div>
        </>
      )}
    </div>
  );
};

// ── STEP 05 絵コンテ ──────────────────────────────────────────────────────────
const StageEicon = ({info,jicon,prompts,assets}) => {
  const [exporting,setExporting]=useState(false);
  const [exportOk,setExportOk]=useState(false);
  const [exportErr,setExportErr]=useState("");

  const imgToDataUrl=async(url)=>{
    if(!url)return null;
    try{
      const r=await fetch(url);
      const blob=await r.blob();
      return new Promise(res=>{const reader=new FileReader();reader.onloadend=()=>res(reader.result);reader.readAsDataURL(blob);});
    }catch{return null;}
  };

  const exportPPTX=async()=>{
    setExporting(true);setExportOk(false);setExportErr("");
    try{
      await loadPptxGen();
      const pres=new window.PptxGenJS();
      pres.layout="LAYOUT_16x9";
      pres.title=(info.product||"絵コンテ")+" 分鏡表";
      const ORANGE="E8820C",ORANGE_H="FFF3E6",BDR="CCCCCC",GRAY="F2F2F2";
      const CUTS_PER=5;
      const total=Math.ceil(jicon.cuts.length/CUTS_PER);
      for(let si=0;si<total;si++){
        const batch=jicon.cuts.slice(si*CUTS_PER,(si+1)*CUTS_PER);
        const slide=pres.addSlide();
        slide.background={color:"FFFFFF"};
        const LX=0.20,TY=0.72,LW=0.70;
        const CW=(9.60-LW)/batch.length;
        const HH=0.38,HC=1.92,HT=0.82,HN=1.08;
        const yH=TY,yC=TY+HH,yT=yC+HC,yN=yT+HT;
        const slideTag=total>1?"  ("+(si+1)+"/"+total+")":"";
        slide.addShape(pres.shapes.RECTANGLE,{x:LX,y:0.10,w:0.055,h:0.48,fill:{color:ORANGE},line:{color:ORANGE}});
        slide.addText((info.product||"字コンテ")+"  分鏡表"+slideTag,{x:LX+0.12,y:0.10,w:7.20,h:0.48,fontSize:15,bold:true,color:"111111",valign:"middle",margin:0});
        slide.addText((info.style||"")+"  ／  "+(info.tones||[]).join("・")+"  ／  "+(info.duration||"30")+"秒",{x:7.50,y:0.10,w:2.30,h:0.48,fontSize:8,color:"999999",valign:"middle",align:"right",margin:0});
        const lrows=[{y:yH,h:HH,text:"番号",bg:ORANGE,fg:"FFFFFF",sz:10,bold:true},{y:yC,h:HC,text:"カット",bg:GRAY,fg:"333333",sz:9,bold:false},{y:yT,h:HT,text:"テロップ",bg:GRAY,fg:"333333",sz:9,bold:false},{y:yN,h:HN,text:"ナレーション",bg:GRAY,fg:"333333",sz:9,bold:false}];
        for(const r of lrows){
          slide.addShape(pres.shapes.RECTANGLE,{x:LX,y:r.y,w:LW,h:r.h,fill:{color:r.bg},line:{color:BDR,pt:0.5}});
          slide.addText(r.text,{x:LX,y:r.y,w:LW,h:r.h,fontSize:r.sz,bold:r.bold,color:r.fg,align:"center",valign:"middle",margin:0});
        }
        for(let ci=0;ci<batch.length;ci++){
          const cut=batch[ci];
          const cx=LX+LW+ci*CW;
          const num=NUMS[si*CUTS_PER+ci]||String(si*CUTS_PER+ci+1);
          const ap=(prompts||[]).find(p=>p.cutNo===cut.cutNo);
          slide.addShape(pres.shapes.RECTANGLE,{x:cx,y:yH,w:CW,h:HH,fill:{color:ORANGE},line:{color:BDR,pt:0.5}});
          slide.addText(num,{x:cx,y:yH,w:CW,h:HH,fontSize:14,bold:true,color:"FFFFFF",align:"center",valign:"middle",margin:0});
          slide.addShape(pres.shapes.RECTANGLE,{x:cx,y:yC,w:CW,h:HC,fill:{color:"FFFFFF"},line:{color:BDR,pt:0.5}});
          const imgUrl=assets[cut.cutNo]?.image;
          if(imgUrl){
            const dataUrl=await imgToDataUrl(imgUrl);
            if(dataUrl){const ih=HC-0.30;const iw=ih*(9/16);try{slide.addImage({data:dataUrl,x:cx+(CW-iw)/2,y:yC+0.06,w:iw,h:ih});}catch(e){}}
          }else{
            const vd=ap?.visualDesc||cut.direction||"";
            if(vd)slide.addText(vd,{x:cx+0.06,y:yC+0.10,w:CW-0.12,h:HC-0.55,fontSize:7.5,color:"999999",align:"center",valign:"middle",wrap:true,margin:0});
          }
          slide.addShape(pres.shapes.RECTANGLE,{x:cx+0.04,y:yC+HC-0.52,w:CW-0.08,h:0.46,fill:{color:ORANGE_H},line:{color:BDR,pt:0}});
          slide.addText(cut.subtitle||"",{x:cx+0.06,y:yC+HC-0.52,w:CW-0.12,h:0.46,fontSize:8.5,bold:true,color:"222222",align:"center",valign:"middle",wrap:true,margin:0});
          slide.addShape(pres.shapes.RECTANGLE,{x:cx,y:yT,w:CW,h:HT,fill:{color:"FFFFFF"},line:{color:BDR,pt:0.5}});
          slide.addText(cut.subtitle||"",{x:cx+0.07,y:yT+0.05,w:CW-0.14,h:HT-0.10,fontSize:9,color:"222222",align:"left",valign:"top",wrap:true,margin:0});
          slide.addShape(pres.shapes.RECTANGLE,{x:cx,y:yN,w:CW,h:HN,fill:{color:"FFFFFF"},line:{color:BDR,pt:0.5}});
          slide.addText(cut.narration||"",{x:cx+0.07,y:yN+0.05,w:CW-0.14,h:HN-0.10,fontSize:9,color:"222222",align:"left",valign:"top",wrap:true,margin:0});
        }
        slide.addText("Vertical Ad Workflow",{x:LX,y:5.46,w:LW+CW*batch.length,h:0.15,fontSize:6.5,color:"CCCCCC",align:"right",margin:0});
      }
      const fname=(info.product||"storyboard").replace(/[\\/:*?"<>|]/g,"_")+"_分鏡表.pptx";
      await pres.writeFile({fileName:fname});
      setExportOk(true);
    }catch(e){setExportErr("エクスポートエラー: "+e.message);}
    setExporting(false);
  };

  if(!jicon)return(
    <div className="fadeIn">
      <StageHeader step="05" title="絵コンテ" sub="字コンテ＋素材を統合した分鏡表です"/>
      <Card style={{textAlign:"center",padding:32}}><div style={{color:C.t2}}>先に字コンテを生成してください</div></Card>
    </div>
  );

  return(
    <div className="fadeIn">
      <StageHeader step="05" title="絵コンテ" sub="字コンテ＋生成素材を統合した最終分鏡表"/>
      <Card style={{marginBottom:20,padding:14}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <Tag color={C.blue}>{info.style}</Tag>
          {(info.tones||[]).map(t=><Tag key={t} color={C.accent}>{t}</Tag>)}
          <Tag color={C.green}>{jicon.totalDuration}</Tag>
          <Tag color={C.teal}>{jicon.cuts.length} カット</Tag>
          <Tag color={C.t2}>素材 {Object.keys(assets).length}/{jicon.cuts.length}</Tag>
          <div style={{flex:1}}/>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
            <Btn variant="primary" onClick={exportPPTX} disabled={exporting} style={{gap:8}}>
              {exporting?<><Spin size={13}/> 生成中...</>:<><span style={{fontSize:15}}>📊</span> Google Slides 用 PPTX をエクスポート</>}
            </Btn>
            {exportOk&&<div style={{fontSize:11,color:C.green}}>✓ ダウンロード完了 — Google スライドにインポートできます</div>}
            {exportErr&&<div style={{fontSize:11,color:C.red}}>{exportErr}</div>}
          </div>
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {jicon.cuts.map((cut,i)=>{
          const color=PHASE_COLORS[i%PHASE_COLORS.length];
          const img=assets[cut.cutNo]?.image;
          const ap=(prompts||[]).find(p=>p.cutNo===cut.cutNo);
          const isVideo=ap?.assetType==="video";
          return(
            <Card key={i} style={{padding:0,overflow:"hidden",borderLeft:`4px solid ${color}`}}>
              <div style={{display:"grid",gridTemplateColumns:"160px 1fr"}}>
                <div style={{background:C.bg3,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:200,padding:16,borderRight:`1px solid ${C.border}`}}>
                  <div style={{width:"100%",aspectRatio:"9/16",maxHeight:180,borderRadius:8,overflow:"hidden",background:C.bg4,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}>
                    {img?<img src={img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                      :isVideo?<div style={{textAlign:"center"}}><div style={{fontSize:22}}>🎬</div><div style={{fontSize:10,color:C.purple,fontFamily:C.mono,marginTop:4}}>動画</div></div>
                      :<div style={{textAlign:"center"}}><div style={{fontSize:22}}>🖼</div><div style={{fontSize:10,color:C.t3,marginTop:4}}>未生成</div></div>}
                  </div>
                  <div style={{fontFamily:C.mono,fontSize:20,fontWeight:700,color:C.t0}}>#{cut.cutNo}</div>
                  <div style={{fontFamily:C.mono,fontSize:10,color:C.t2}}>{cut.startSec}s — {cut.endSec}s</div>
                  <div style={{marginTop:5}}><Tag color={color}>{cut.phase}</Tag></div>
                </div>
                <div style={{padding:18,display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <div style={{background:C.bg3,borderRadius:8,padding:"10px 14px"}}>
                      <div style={{fontSize:10,color:C.t2,fontFamily:C.mono,letterSpacing:1,marginBottom:5}}>テロップ</div>
                      <div style={{fontSize:15,color:C.blue,fontWeight:700,lineHeight:1.5}}>{cut.subtitle}</div>
                    </div>
                    <div style={{background:C.bg3,borderRadius:8,padding:"10px 14px"}}>
                      <div style={{fontSize:10,color:C.t2,fontFamily:C.mono,letterSpacing:1,marginBottom:5}}>ナレーション</div>
                      <div style={{fontSize:13,color:C.t0,lineHeight:1.7}}>{cut.narration}</div>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                    {[["SE/BGM",cut.se,C.t1],["演出ト書き",cut.direction,C.orange],["カメラ",ap?.cameraAngle||"—",C.t1]].map(([l,v,col])=>(
                      <div key={l}>
                        <div style={{fontSize:10,color:C.t2,fontFamily:C.mono,marginBottom:3}}>{l}</div>
                        <div style={{fontSize:12,color:col,lineHeight:1.5}}>{v||"—"}</div>
                      </div>
                    ))}
                  </div>
                  {ap&&(
                    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10}}>
                      <div style={{background:C.bg3,borderRadius:6,padding:"8px 10px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <Tag color={C.green}>英語Prompt</Tag>
                          <CopyBtn text={ap.imagePrompt||ap.geminiPrompt||""}/>
                        </div>
                        <div style={{fontSize:11,color:C.t2,fontFamily:C.mono,lineHeight:1.5,wordBreak:"break-word",maxHeight:42,overflow:"hidden"}}>{ap.imagePrompt||ap.geminiPrompt}</div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
};

// ── Root ─────────────────────────────────────────────────────────────────────
function App(){
  const [stage,setStage]=useState("info");
  const [showSettings,setShowSettings]=useState(false);
  const [workerUrl,setWorkerUrl]=useState(typeof DEFAULT_WORKER!=="undefined"?DEFAULT_WORKER:"");
  const [info,setInfo]=useState({clientName:"",clientContact:"",clientBrief:"",competitor:"",product:"",brand:"",features:"",price:"",target:"",tones:[],style:"",platforms:["TikTok","Instagram Reels"],duration:"30",cta:"今すぐチェック！",ng:"",required:"",lpUrl:"",lpSummary:"",refs:[]});
  const [personas,setPersonas]=useState(null);
  const [selectedPersona,setSelectedPersona]=useState(null);
  const [jicon,setJicon]=useState(null);
  const [prompts,setPrompts]=useState(null);
  const [assets,setAssets]=useState({});
  const [refVideos,setRefVideos]=useState([]);

  const done=[
    info.product&&(info.tones||[]).length>0&&info.style?"info":null,
    personas?"persona":null,
    jicon?"jicon":null,
    prompts?"sozai":null,
  ].filter(Boolean);

  return(
    <>
      <GlobalStyle/>
      {showSettings&&<SettingsModal workerUrl={workerUrl} setWorkerUrl={setWorkerUrl} onClose={()=>setShowSettings(false)}/>}
      <div style={{display:"flex",minHeight:"100vh"}}>
        <Sidebar current={stage} set={setStage} onSettings={()=>setShowSettings(true)} done={done}/>
        <main style={{marginLeft:220,flex:1,padding:32,maxWidth:"calc(100vw - 220px)",overflowX:"hidden"}}>
          {stage==="info"&&<StageInfo info={info} set={setInfo} geminiKey={workerUrl} refVideos={refVideos} setRefVideos={setRefVideos} onNext={()=>setStage("persona")}/>}
          {stage==="persona"&&<StagePersona info={info} personas={personas} setPersonas={setPersonas} selectedPersona={selectedPersona} setSelectedPersona={setSelectedPersona} geminiKey={workerUrl} refVideos={refVideos} onNext={()=>setStage("jicon")}/>}
          {stage==="jicon"&&<StageJicon info={info} persona={selectedPersona} jicon={jicon} setJicon={setJicon} geminiKey={workerUrl} refVideos={refVideos} onNext={()=>setStage("sozai")}/>}
          {stage==="sozai"&&<StageSozai info={info} jicon={jicon} prompts={prompts} setPrompts={setPrompts} assets={assets} setAssets={setAssets} geminiKey={workerUrl} onNext={()=>setStage("eicon")}/>}
          {stage==="eicon"&&<StageEicon info={info} jicon={jicon} prompts={prompts} assets={assets}/>}
        </main>
      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
